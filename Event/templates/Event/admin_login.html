<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - JanaDecors</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 50%, #16213e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 111, 97, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(74, 144, 226, 0.08) 0%, transparent 50%);
            pointer-events: none;
        }

        .login-wrapper {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            animation: fadeInUp 0.6s ease-out;
            position: relative;
            z-index: 1;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-card {
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
        }

        .login-header {
            background: linear-gradient(135deg, #ff6f61 0%, #4a90e2 100%);
            padding: 35px 20px;
            text-align: center;
            color: white;
        }

        .login-header .icon {
            font-size: 50px;
            margin-bottom: 12px;
            display: block;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .login-header h3 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .login-header .badge {
            background: rgba(255, 255, 255, 0.25);
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            margin-top: 8px;
            display: inline-block;
        }

        .security-box {
            background: rgba(255, 111, 97, 0.1);
            border: 1px solid rgba(255, 111, 97, 0.2);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 12px;
            color: #ffc9c5;
        }

        .security-box i {
            color: #ff6f61;
            margin-right: 6px;
        }

        .login-body {
            padding: 25px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            font-weight: 600;
            color: #ddd;
            margin-bottom: 6px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 13px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            transition: 0.3s;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .form-control:focus {
            border-color: #ff6f61;
            box-shadow: 0 0 0 0.2rem rgba(255, 111, 97, 0.15);
            background: rgba(255, 255, 255, 0.12);
            color: white;
        }

        .form-check {
            margin-bottom: 14px;
        }

        .form-check-label {
            font-size: 13px;
            color: #bbb;
            margin-top: 2px;
        }

        .form-check-input {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .form-check-input:checked {
            background-color: #ff6f61;
            border-color: #ff6f61;
        }

        .btn-login {
            background: linear-gradient(135deg, #ff6f61 0%, #4a90e2 100%);
            border: none;
            border-radius: 10px;
            padding: 10px 15px;
            font-weight: 600;
            width: 100%;
            margin-top: 8px;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
            color: white;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 111, 97, 0.3);
            color: white;
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .progress-loader {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .spinner-border {
            width: 20px;
            height: 20px;
        }

        .login-footer {
            padding: 15px 25px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 12px;
            color: #aaa;
        }

        .login-footer a {
            color: #ff6f61;
            text-decoration: none;
            font-weight: 600;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <!-- Header -->
            <div class="login-header">
                <i class="icon bi bi-shield-lock"></i>
                <h3>Admin Portal</h3>
                <div class="badge">🔐 STAFF ONLY ACCESS</div>
            </div>

            <!-- Body -->
            <div class="login-body">
                <div class="security-box">
                    <i class="bi bi-exclamation-triangle"></i>
                    <strong>Security Notice:</strong> Authorized personnel only. Unauthorized access is prohibited.
                </div>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger alert-dismissible fade show" role="alert" style="background: rgba(255, 111, 97, 0.15); border-color: rgba(255, 111, 97, 0.3); color: #ffc9c5;">
                            <i class="bi bi-exclamation-circle"></i> {{ message }}
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST" id="loginForm">
                    {% csrf_token %}

                    <div class="form-group">
                        <label class="form-label"><i class="bi bi-envelope"></i> Email</label>
                        <input type="email" name="email" class="form-control" placeholder="admin@janadecos.com" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label"><i class="bi bi-lock"></i> Password</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="remember" id="remember">
                        <label class="form-check-label" for="remember">Keep me logged in</label>
                    </div>

                    <button type="submit" class="btn btn-login" id="loginBtn">
                        <span id="btnText">Access Admin Panel</span>
                        <span class="progress-loader" id="loader">
                            <span class="spinner-border spinner-border-sm text-white" role="status"></span>
                        </span>
                    </button>
                </form>
            </div>

            <!-- Footer -->
            <div class="login-footer">
                <p class="mb-2"><a href="{% url 'plans' %}"><i class="bi bi-arrow-left"></i> Back to user panel</a></p>
                <p class="mb-0">Need help? <a href="#">Contact support</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const btn = document.getElementById('loginBtn');
            const loader = document.getElementById('loader');
            const btnText = document.getElementById('btnText');
            
            btn.disabled = true;
            loader.style.display = 'inline-block';
            btnText.style.display = 'none';
        });
    </script>
</body>
</html>
