{% extends 'base.html' %}
{% block content %}

<h2>Verify OTP</h2>

<div class="card p-3 shadow">

{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}

<form method="POST">
    {% csrf_token %}
    <input type="text" name="otp" class="form-control" placeholder="Enter OTP">
    <button class="btn btn-success mt-2 w-100">Verify</button>
</form>

</div>

{% endblock %}
