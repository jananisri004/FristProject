<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Dashboard - JanaDecors{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .admin-wrapper {
            display: flex;
            height: 100vh;
        }

        /* SIDEBAR */
        .admin-sidebar {
            width: 260px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.15);
            overflow-y: auto;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            z-index: 1000;
        }

        .admin-sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .admin-sidebar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }

        .admin-sidebar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        .sidebar-header {
            padding: 25px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .sidebar-header .logo {
            font-size: 28px;
            margin-bottom: 8px;
            display: block;
        }

        .sidebar-header h4 {
            font-size: 16px;
            font-weight: 700;
            margin: 0;
        }

        .sidebar-header p {
            font-size: 12px;
            opacity: 0.8;
            margin: 5px 0 0 0;
        }

        .sidebar-menu {
            flex: 1;
            padding: 20px 0;
            list-style: none;
        }

        .sidebar-menu li {
            margin: 5px 0;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: 0.3s;
            font-size: 14px;
            font-weight: 500;
        }

        .sidebar-menu a:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding-left: 25px;
        }

        .sidebar-menu a.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border-left: 4px solid white;
            padding-left: 20px;
        }

        .sidebar-menu i {
            width: 20px;
            text-align: center;
        }

        .sidebar-footer {
            padding: 15px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: auto;
        }

        .sidebar-footer .user-info {
            font-size: 12px;
            margin-bottom: 10px;
            text-align: center;
        }

        .sidebar-footer button {
            width: 100%;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: 0.3s;
        }

        .sidebar-footer button:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* MAIN CONTENT */
        .admin-content {
            flex: 1;
            margin-left: 260px;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .admin-header {
            background: white;
            padding: 20px 30px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .admin-header h2 {
            font-size: 22px;
            font-weight: 700;
            color: #333;
            margin: 0;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .admin-main {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
        }

        /* SCROLLBAR */
        .admin-main::-webkit-scrollbar {
            width: 8px;
        }

        .admin-main::-webkit-scrollbar-track {
            background: #f5f7fa;
        }

        .admin-main::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        .admin-main::-webkit-scrollbar-thumb:hover {
            background: #999;
        }

        /* STATS CARDS */
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            text-align: center;
            transition: 0.3s;
            border: 1px solid #e0e0e0;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .stat-card-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .stat-card h5 {
            font-size: 12px;
            color: #999;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card h3 {
            font-size: 28px;
            font-weight: 700;
            color: #667eea;
            margin: 0;
        }

        /* SECTION TITLE */
        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #333;
            margin-top: 30px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* TABLE */
        .table {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .table thead th {
            background: #f5f7fa;
            border: none;
            font-weight: 700;
            color: #333;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 15px;
        }

        .table tbody td {
            padding: 15px;
            border: 1px solid #e0e0e0;
            vertical-align: middle;
        }

        .table tbody tr:hover {
            background: #f9f9f9;
        }

        /* BUTTONS */
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-danger {
            background: #ff6f61;
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-danger:hover {
            background: #ff5548;
        }

        .btn-success {
            background: #4caf50;
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-success:hover {
            background: #45a049;
        }

        .btn-warning {
            background: #ff9800;
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-warning:hover {
            background: #e68900;
        }

        .btn-delete {
            background: #ff6f61 !important;
        }

        .btn-delete:hover {
            background: #ff5548 !important;
        }

        /* STATUS BADGE */
        .badge {
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-success {
            background: #d4edda;
            color: #155724;
        }

        .badge-warning {
            background: #fff3cd;
            color: #856404;
        }

        .badge-danger {
            background: #f8d7da;
            color: #721c24;
        }

        .badge-info {
            background: #d1ecf1;
            color: #0c5460;
        }

        /* RESPONSIVE */
        @media (max-width: 992px) {
            .admin-sidebar {
                width: 240px;
            }

            .admin-content {
                margin-left: 240px;
            }

            .admin-main {
                padding: 20px;
            }
        }

        @media (max-width: 768px) {
            .admin-sidebar {
                width: 200px;
            }

            .admin-content {
                margin-left: 200px;
            }

            .admin-main {
                padding: 15px;
            }

            .sidebar-header {
                padding: 20px 15px;
            }

            .sidebar-menu a {
                padding: 10px 15px;
                font-size: 13px;
            }

            .admin-header {
                padding: 15px 20px;
                flex-direction: column;
                gap: 10px;
            }

            .admin-header h2 {
                font-size: 18px;
            }

            .stat-card {
                padding: 15px;
            }

            .stat-card h3 {
                font-size: 24px;
            }

            .table {
                font-size: 12px;
            }

            .btn-sm {
                padding: 4px 8px;
                font-size: 11px;
            }
        }

        @media (max-width: 576px) {
            .admin-wrapper {
                flex-direction: column;
            }

            .admin-sidebar {
                width: 100%;
                height: auto;
                position: relative;
                flex-direction: row;
                overflow-x: auto;
            }

            .admin-content {
                margin-left: 0;
                height: auto;
            }

            .admin-main {
                padding: 10px;
            }

            .sidebar-menu {
                display: flex;
                padding: 10px 0;
                overflow-x: auto;
            }

            .sidebar-menu li {
                min-width: 100px;
                margin: 0 5px;
            }

            .sidebar-footer {
                display: none;
            }

            .admin-header {
                padding: 10px;
            }

            .admin-header h2 {
                font-size: 16px;
            }

            .stat-card {
                padding: 12px;
            }

            .stat-card h3 {
                font-size: 20px;
            }

            .stat-card-icon {
                font-size: 24px;
            }

            .table {
                font-size: 10px;
            }

            .table thead th,
            .table tbody td {
                padding: 8px 4px !important;
            }

            .badge {
                font-size: 8px;
                padding: 2px 4px;
            }

            .btn-sm {
                padding: 3px 6px;
                font-size: 9px;
            }

            .btn {
                padding: 6px 12px;
                font-size: 12px;
            }
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="admin-wrapper">
        <!-- SIDEBAR -->
        <div class="admin-sidebar">
            <div class="sidebar-header">
                <i class="logo bi bi-gem"></i>
                <h4>JanaDecors</h4>
                <p>Admin Portal</p>
            </div>

            <ul class="sidebar-menu">
                <li>
                    <a href="{% url 'plans' %}" class="{% if request.resolver_match.url_name == 'plans' %}active{% endif %}">
                        <i class="bi bi-house-door"></i>
                        Home
                    </a>
                </li>
                <li>
                    <a href="{% url 'admin_dashboard' %}" class="{% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}">
                        <i class="bi bi-speedometer2"></i>
                        Dashboard
                    </a>
                </li>
                <li>
                    <a href="{% url 'admin_users' %}" class="{% if request.resolver_match.url_name == 'admin_users' %}active{% endif %}">
                        <i class="bi bi-people"></i>
                        Users
                    </a>
                </li>
                <li>
                    <a href="{% url 'admin_bookings' %}" class="{% if request.resolver_match.url_name == 'admin_bookings' %}active{% endif %}">
                        <i class="bi bi-calendar2-check"></i>
                        Bookings
                    </a>
                </li>
                <li>
                    <a href="{% url 'admin_events' %}" class="{% if request.resolver_match.url_name == 'admin_events' %}active{% endif %}">
                        <i class="bi bi-ticket-perforated"></i>
                        Events
                    </a>
                </li>
                <li>
                    <a href="{% url 'add_event' %}" class="{% if request.resolver_match.url_name == 'add_event' %}active{% endif %}">
                        <i class="bi bi-plus-circle"></i>
                        Add Event
                    </a>
                </li>
            </ul>

            <div class="sidebar-footer">
                <div class="user-info">
                    <i class="bi bi-person-circle"></i>
                    <div>{{ user.first_name|default:user.username }}</div>
                </div>
                <form method="POST" action="{% url 'logout' %}" class="m-0">
                    {% csrf_token %}
                    <button type="submit"><i class="bi bi-box-arrow-right"></i> Logout</button>
                </form>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="admin-content">
            <!-- HEADER -->
            <div class="admin-header">
                <h2>{% block page_title %}Dashboard{% endblock %}</h2>
                <div class="header-right">
                    <span class="text-muted"><i class="bi bi-clock"></i> <span id="time"></span></span>
                </div>
            </div>

            <!-- CONTENT -->
            <div class="admin-main">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Update time
        function updateTime() {
            const now = new Date();
            document.getElementById('time').textContent = now.toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit',
                hour12: true 
            });
        }
        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
