{% extends 'Event/user_base.html' %}
{% block content %}

<div class="card shadow p-4" style="border-radius: 20px;">

<div id="carouselExample" class="carousel slide mb-3">
<div class="carousel-inner">

<div class="carousel-item active">
<img src="{{ plan.image.url }}" class="d-block w-100" style="height:400px; object-fit:cover;">
</div>

</div>
</div>

<h2 class="fw-bold">{{ plan.name }}</h2>

<p class="text-muted">{{ plan.description }}</p>

<h3 class="text-success">₹{{ plan.price }}</h3>

<div class="btn-group mt-3" role="group">
    <a href="{% url 'book' plan.id %}" class="btn btn-lg btn-success">
        <i class="bi bi-check-circle me-2"></i>Book Now 🎉
    </a>
    {% if user.is_authenticated %}
        <a href="{% url 'wishlist_add' plan.id %}" class="btn btn-outline-danger">
            <i class="bi bi-heart me-2"></i>Add to Wishlist ❤️
        </a>
    {% endif %}
</div>

</div>

{% endblock %}
